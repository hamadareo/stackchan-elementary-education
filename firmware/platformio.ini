; StackChan(CoreS3) × Sokutsu ブリッジ用ファーム。Arduino + M5Unified + m5stack-avatar。
; 公式 stack-chan リポジトリ(Moddable 版)とは別系統。サーボ/顔/マイク/スピーカーを自前で薄く制御する。
[env:m5stack-cores3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5Unified@^0.2.2
  m5stack/M5GFX@^0.2.6
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.2.0
  https://github.com/m5stack/StackChan-BSP.git#1.1.1

; 無線書き込み: SC_OTA_PASS=<config.h の OTA_PASS> pio run -e ota -t upload --upload-port <端末の IP>
[env:ota]
extends = env:m5stack-cores3
upload_protocol = espota
upload_flags = --auth=${sysenv.SC_OTA_PASS}
