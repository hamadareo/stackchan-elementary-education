<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">
  <defs>
    <style>
      .t{font-size:15px;fill:#1f2937}.s{font-size:12px;fill:#4b5563}.h{font-size:17px;font-weight:700;fill:#0f172a}
      .pc{fill:#eef6ff;stroke:#3b82f6;stroke-width:2}.bot{fill:#ecfdf5;stroke:#10b981;stroke-width:2}
      .tea{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.usb{stroke:#10b981;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" class="h" font-size="22">教室での構成(USB のみ・インターネット不要)</text>

  <g>
    <rect x="40" y="70" width="280" height="190" rx="14" class="pc"/>
    <text x="180" y="98" text-anchor="middle" class="h">パソコン ①(Ubuntu)</text>
    <text x="180" y="124" text-anchor="middle" class="t">ブリッジ ・ 管理アプリ</text>
    <text x="180" y="146" text-anchor="middle" class="s">聞き取り / 翻訳 / 声(VOICEVOX)</text>
    <text x="180" y="166" text-anchor="middle" class="s">顔検出 ・ 遊びの進行 ・ 授業の制御</text>
    <text x="180" y="204" text-anchor="middle" class="s">ゲームパッド / ジョイスティック</text>
    <text x="180" y="226" text-anchor="middle" class="s">(挿すと自動で使えます)</text>
  </g>
  <g>
    <rect x="340" y="70" width="280" height="190" rx="14" class="pc"/>
    <text x="480" y="98" text-anchor="middle" class="h">パソコン ②(Ubuntu)</text>
    <text x="480" y="124" text-anchor="middle" class="t">ブリッジ ・ 管理アプリ</text>
    <text x="480" y="146" text-anchor="middle" class="s">聞き取り / 翻訳 / 声(VOICEVOX)</text>
    <text x="480" y="166" text-anchor="middle" class="s">顔検出 ・ 遊びの進行 ・ 授業の制御</text>
  </g>
  <g>
    <rect x="640" y="70" width="280" height="190" rx="14" class="pc"/>
    <text x="780" y="98" text-anchor="middle" class="h">パソコン ③(Ubuntu)</text>
    <text x="780" y="124" text-anchor="middle" class="t">ブリッジ ・ 管理アプリ</text>
    <text x="780" y="146" text-anchor="middle" class="s">聞き取り / 翻訳 / 声(VOICEVOX)</text>
    <text x="780" y="166" text-anchor="middle" class="s">顔検出 ・ 遊びの進行 ・ 授業の制御</text>
  </g>

  <path d="M180 260 V330" class="usb"/><path d="M480 260 V330" class="usb"/><path d="M780 260 V330" class="usb"/>
  <text x="196" y="302" class="s">USB ケーブル</text><text x="496" y="302" class="s">USB ケーブル</text><text x="796" y="302" class="s">USB ケーブル</text>

  <g>
    <rect x="80" y="330" width="200" height="110" rx="14" class="bot"/>
    <text x="180" y="360" text-anchor="middle" class="h">StackChan 1号機</text>
    <text x="180" y="384" text-anchor="middle" class="s">耳(マイク)・口(スピーカー)</text>
    <text x="180" y="402" text-anchor="middle" class="s">顔(画面)・目(カメラ)・首</text>
    <text x="180" y="424" text-anchor="middle" class="s">子ども 1 チーム</text>
  </g>
  <g>
    <rect x="380" y="330" width="200" height="110" rx="14" class="bot"/>
    <text x="480" y="360" text-anchor="middle" class="h">StackChan 2号機</text>
    <text x="480" y="384" text-anchor="middle" class="s">耳(マイク)・口(スピーカー)</text>
    <text x="480" y="402" text-anchor="middle" class="s">顔(画面)・目(カメラ)・首</text>
    <text x="480" y="424" text-anchor="middle" class="s">子ども 1 チーム</text>
  </g>
  <g>
    <rect x="680" y="330" width="200" height="110" rx="14" class="bot"/>
    <text x="780" y="360" text-anchor="middle" class="h">StackChan 3号機</text>
    <text x="780" y="384" text-anchor="middle" class="s">耳(マイク)・口(スピーカー)</text>
    <text x="780" y="402" text-anchor="middle" class="s">顔(画面)・目(カメラ)・首</text>
    <text x="780" y="424" text-anchor="middle" class="s">子ども 1 チーム</text>
  </g>

  <rect x="40" y="466" width="880" height="36" rx="10" class="tea"/>
  <text x="480" y="490" text-anchor="middle" class="t">先生は、各パソコンの管理アプリ(または画面のブラウザ)で、遊びの開始・中止を操作します。機器どうしは連携しません。</text>
</svg>
