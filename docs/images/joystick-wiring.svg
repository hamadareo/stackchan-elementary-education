<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">
  <style>.t{font-size:15px;fill:#1f2937}.s{font-size:13px;fill:#4b5563}.h{font-size:18px;font-weight:700;fill:#0f172a}.pin{font-size:14px;font-weight:700;fill:#0f172a}</style>
  <rect width="820" height="400" fill="#fff"/>
  <text x="410" y="34" text-anchor="middle" class="h" font-size="22">ジョイスティックの配線(Arduino UNO)</text>
  <rect x="470" y="70" width="300" height="290" rx="16" fill="#0ea5e9" fill-opacity=".12" stroke="#0284c7" stroke-width="2"/>
  <text x="620" y="100" text-anchor="middle" class="h">Arduino UNO</text>
  <text x="620" y="124" text-anchor="middle" class="s">USB でパソコンへ(挿すと自動セットアップ)</text>
  <rect x="50" y="90" width="230" height="250" rx="16" fill="#f59e0b" fill-opacity=".12" stroke="#d97706" stroke-width="2"/>
  <text x="165" y="120" text-anchor="middle" class="h">アナログスティック</text>
  <text x="165" y="142" text-anchor="middle" class="s">(KY-023 など)</text>
  <circle cx="165" cy="215" r="38" fill="#fff" stroke="#d97706" stroke-width="3"/><circle cx="165" cy="215" r="16" fill="#d97706"/>
  <g class="pin">
    <text x="290" y="170">GND</text><text x="290" y="205">+5V</text><text x="290" y="240">VRx</text><text x="290" y="275">VRy</text><text x="290" y="310">SW</text>
    <text x="412" y="170">GND</text><text x="412" y="205">5V</text><text x="412" y="240">A0</text><text x="412" y="275">A1</text><text x="412" y="310">D2</text>
  </g>
  <line x1="330" y1="165" x2="400" y2="165" stroke="#111827" stroke-width="4"/>
  <line x1="330" y1="200" x2="400" y2="200" stroke="#dc2626" stroke-width="4"/>
  <line x1="330" y1="235" x2="400" y2="235" stroke="#2563eb" stroke-width="4"/>
  <line x1="330" y1="270" x2="400" y2="270" stroke="#16a34a" stroke-width="4"/>
  <line x1="330" y1="305" x2="400" y2="305" stroke="#a855f7" stroke-width="4"/>
  <text x="640" y="200" text-anchor="middle" class="t">左右(VRx)→ A0</text>
  <text x="640" y="228" text-anchor="middle" class="t">上下(VRy)→ A1</text>
  <text x="640" y="256" text-anchor="middle" class="t">ボタン(SW)→ D2</text>
  <text x="620" y="300" text-anchor="middle" class="s">50 回/秒で "J,x,y,b" を USB シリアルに送ります</text>
  <text x="620" y="322" text-anchor="middle" class="s">(115200 bps)</text>
  <text x="410" y="386" text-anchor="middle" class="s">線が浮くと、手を離しても値が揺れて、首が勝手に動きます。ジャンパー線は奥まで挿してください。</text>
</svg>
